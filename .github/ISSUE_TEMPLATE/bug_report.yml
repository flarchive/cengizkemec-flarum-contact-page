name: Bug report
description: Report a reproducible problem with Contact Page.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please do not include
        secrets, private forum data, visitor messages or email addresses.
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: flarum-version
    attributes:
      label: Flarum version
      placeholder: 2.0.2
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: 8.4.27
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Enable the extension...
        2. Configure...
        3. Submit...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets, tokens, email addresses and private data first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed secrets and private data from this report.
          required: true
